name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest -v


  docker-build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t clouddeploy:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save clouddeploy:${{ github.sha }} -o clouddeploy.tar

      - name: Upload image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key
          chmod 600 deploy_key

          scp \
            -o StrictHostKeyChecking=no \
            -i deploy_key \
            clouddeploy.tar \
            ${EC2_USER}@${EC2_HOST}:/tmp/clouddeploy.tar

      - name: Deploy to Kubernetes
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key
          chmod 600 deploy_key

          ssh \
            -o StrictHostKeyChecking=no \
            -i deploy_key \
            ${EC2_USER}@${EC2_HOST} \
            "sudo k3s ctr -n k8s.io images import /tmp/clouddeploy.tar && \
             sudo k3s kubectl set image deployment/clouddeploy \
             clouddeploy=clouddeploy:${{ github.sha }} \
             -n clouddeploy && \
             sudo k3s kubectl patch deployment clouddeploy \
             -n clouddeploy \
             -p '{\"spec\":{\"template\":{\"spec\":\"containers\":[{\"name\":\"clouddeploy\",\"imagePullPolicy\":\"Never\"}]}}}}' && \
             sudo k3s kubectl rollout status deployment/clouddeploy \
             -n clouddeploy --timeout=180s"

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key
          chmod 600 deploy_key

          ssh \
            -o StrictHostKeyChecking=no \
            -i deploy_key \
            ${EC2_USER}@${EC2_HOST} \
            "sudo k3s kubectl get pods -n clouddeploy && \
             curl -f http://localhost:30080/health"